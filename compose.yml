# Track Map - run anywhere with Docker. Pulls the prebuilt image and serves on :8080.
# No build, no config, no accounts needed.
#
#   docker compose up -d        # then open http://localhost:8080
#
# Want HTTPS / a domain? Put any reverse proxy (nginx, Caddy, Traefik, …) in front
# of the container's port 80.

services:
  track-map:
    image: ghcr.io/apatenaude/track-map:latest
    container_name: track-map
    restart: unless-stopped
    ports:
      - "8080:80" # host:container - change the left number to use a different host port
