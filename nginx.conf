server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow" always;

  # /<track> and any other page route -> the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Track data: a missing file is a 404, never the app's HTML (which would be cached as a tile).
  # The track list and documents revalidate so a new deploy shows up right away.
  location /tracks/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  # Tile folders are named after the image's hash: their content never changes.
  location ~ ^/tracks/[^/]+/tiles- {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow" always;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
